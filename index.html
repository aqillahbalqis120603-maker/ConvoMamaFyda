<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFE27A">
  <title>Konvokesyen Taska Mama Fyda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="page1">

  <!-- Hiasan latar: matahari, awan, bukit & rumah (dijana oleh app.js) -->
  <div id="deco" class="deco" aria-hidden="true"></div>

  <!-- Butang lagu ceria -->
  <button id="musicBtn" class="music-btn" onclick="toggleMusic()" aria-label="Mainkan atau henti lagu">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18V6l10-2v12"/>
      <circle cx="6.5" cy="18" r="2.8" fill="currentColor"/>
      <circle cx="16.5" cy="16" r="2.8" fill="currentColor"/>
      <line class="slash" x1="3" y1="3" x2="21" y2="21" stroke="#E64A4A" stroke-width="2.6"/>
    </svg>
  </button>

  <!-- PAGE 1: Halaman Sampul -->
  <section id="page1" class="page active" onclick="goToPage2()">
    <div class="hero">
      <h1 class="title">
        <span class="rainbow">Majlis</span>
        <span class="rainbow">Konvokesyen</span>
      </h1>

      <div class="logo-wrap">
        <img class="logo-img" src="assets/logo-taska.jpg" alt="Logo Taska Mama Fyda" onerror="logoFallback(this)">
      </div>

      <div class="ribbon"><span>Sesi 2026</span></div>

      <button class="btn-big" onclick="event.stopPropagation(); goToPage2()">🎓 Sentuh untuk mula</button>
      <p class="hint">🎵 Tekan butang ♪ di penjuru untuk lagu ceria</p>
    </div>
  </section>

  <!-- PAGE 2: Menu Utama & Nama Murid -->
  <section id="page2" class="page">
    <div class="card menu">
      <div class="logo-wrap sm">
        <img class="logo-img" src="assets/logo-taska.jpg" alt="Logo Taska Mama Fyda" onerror="logoFallback(this)">
      </div>

      <h2 class="wordmark">
        <span class="w-g">Taska</span> <span class="w-r">Mama</span> <span class="w-b">Fyda</span>
      </h2>

      <div class="pantun-box">
        <p class="pantun">
          Bunga tulip cantik berseri,<br>
          Warnanya indah menarik hati,<br>
          Hari konvo penuh memori,<br>
          Abadikan senyuman si kecil hari ini!
        </p>
      </div>

      <div class="input-group">
        <label for="studentName">Nama Murid / Ibu Bapa</label>
        <input type="text" id="studentName" placeholder="Taip nama di sini" maxlength="30" autocomplete="off">
      </div>

      <button class="btn-primary" onclick="goToPage3()">📷 AMBIL GAMBAR</button>
      <button class="btn-secondary" onclick="goToPage4()">🖼️ LIHAT ALBUM KENANGAN</button>
    </div>
  </section>

  <!-- PAGE 3: Kamera & Bingkai Comel -->
  <section id="page3" class="page">
    <div class="camera-screen">
      <div class="top-bar">
        <button class="icon-btn" onclick="goToPage2()" aria-label="Tutup">✕</button>
        <h3 class="top-title">Konvo Mama Fyda</h3>
        <button class="icon-btn" onclick="flipCamera()" aria-label="Pusing kamera">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
        </button>
      </div>

      <div class="camera-wrapper">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="frameCanvas" class="frame-overlay" width="1080" height="1440"></canvas>
        <canvas id="photoCanvas" style="display:none;"></canvas>
      </div>

      <!-- Pilihan Bingkai -->
      <div class="frame-options">
        <button data-frame="convo" onclick="changeFrame('convo')">🎓 Graduasi</button>
        <button data-frame="rainbow" onclick="changeFrame('rainbow')">🌈 Pelangi</button>
        <button data-frame="star" onclick="changeFrame('star')">⭐ Bintang</button>
        <button data-frame="asli" onclick="changeFrame('asli')">Asli</button>
      </div>

      <div class="shutter-container">
        <button id="snapBtn" class="shutter-btn" aria-label="Ambil gambar">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
      </div>
      <p id="uploadStatus" class="upload-status"></p>
    </div>
  </section>

  <!-- PAGE 4: Album Kenangan -->
  <section id="page4" class="page">
    <div class="album-screen">
      <div class="top-bar album-head">
        <button class="icon-btn" onclick="goToPage2()" aria-label="Kembali">‹</button>
        <div>
          <h2 class="album-title">Album Kenangan</h2>
          <p class="sub-title">Momen Indah Konvokesyen</p>
        </div>
        <button class="icon-btn" onclick="loadAlbum()" aria-label="Muat semula">↻</button>
      </div>

      <div id="albumContainer" class="album-container"></div>

      <div class="album-footer">
        <button class="btn-primary" onclick="goToPage3()">📷 AMBIL GAMBAR LAGI</button>
      </div>
    </div>
  </section>

  <div id="flash"></div>
  <div id="toast" role="status"></div>

  <!-- Lagu Latar Belakang Ceria -->
  <audio id="bgMusic" src="assets/audio/song.mp3" loop></audio>

  <script src="app.js"></script>
</body>
</html>
